<!DOCTYPE html>
<lang=ja>
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Protein RANKING</title>
</head>
<body>
    <h1>Protein RANKING</h1>
    <input id="search" placeholder="検索したい飲食物を入力">
    <form id="form">
        <input id="title" placeholder="追加する飲食物を入力">
        <input id="tags" placeholder="タグを入力してください"> 
        <input id="inprotein" placeholder="含まれるたんぱく質量を入力してください">
        <input id="gram" placeholder="飲食物のグラム数を入力してください">
        <button>追加する</button>
    </form>
    <div id="protein-list">
    </div>
    <script type="module" src="./dist/app.js"></script>
</body>
</html>
